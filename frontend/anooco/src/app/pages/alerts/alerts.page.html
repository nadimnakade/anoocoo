<div class="floating-header">
  <div class="back-btn" (click)="goBack()">
    <ion-icon name="chevron-back-outline"></ion-icon>
  </div>
  <div class="header-title">Recent Alerts</div>
</div>

<ion-content class="content-with-floating-header">
  <ion-refresher slot="fixed" (ionRefresh)="loadAlerts($event)">
    <ion-refresher-content></ion-refresher-content>
  </ion-refresher>

  <div class="alerts-container">
    <div class="filters">
      <div class="filter-group">
        <span class="filter-label">Time</span>
        <button type="button" class="filter-chip" [class.active]="timeWindowHours === 2" (click)="setTimeWindow(2)">
          2h
        </button>
        <button type="button" class="filter-chip" [class.active]="timeWindowHours === 6" (click)="setTimeWindow(6)">
          6h
        </button>
        <button type="button" class="filter-chip" [class.active]="timeWindowHours === 24" (click)="setTimeWindow(24)">
          24h
        </button>
        <button type="button" class="filter-chip" [class.active]="timeWindowHours === 48" (click)="setTimeWindow(48)">
          48h
        </button>
      </div>

      <div class="filter-group">
        <span class="filter-label">Type</span>
        <button type="button" class="filter-chip" [class.active]="eventFilter === 'all'" (click)="setEventFilter('all')">
          All
        </button>
        <button type="button" class="filter-chip" [class.active]="eventFilter === 'pothole'" (click)="setEventFilter('pothole')">
          Potholes
        </button>
        <button type="button" class="filter-chip" [class.active]="eventFilter === 'police'" (click)="setEventFilter('police')">
          Police
        </button>
        <button type="button" class="filter-chip" [class.active]="eventFilter === 'traffic'" (click)="setEventFilter('traffic')">
          Traffic
        </button>
      </div>
    </div>

    <ion-list *ngIf="alerts.length > 0">
      <ion-item *ngFor="let evt of alerts" lines="none" class="alert-item">
        <div slot="start" class="alert-icon-wrapper" [class]="evt.eventType.toLowerCase()">
          <ion-icon [name]="getIcon(evt.eventType)"></ion-icon>
        </div>
        <ion-label>
          <h2>{{ evt.description }}</h2>
          <p>{{ evt.address }}</p>
          <div class="alert-meta">
            <span class="time">{{ evt.updatedAt | date:'shortTime' }}</span>
            <span class="status" *ngIf="evt.status === 'verified'">Verified</span>
          </div>
        </ion-label>
      </ion-item>
    </ion-list>

    <div *ngIf="!isLoading && alerts.length === 0" class="empty-state">
      <ion-icon name="checkmark-circle-outline"></ion-icon>
      <h3>No alerts found</h3>
      <p>The roads are clear based on your filters.</p>
    </div>
  </div>
</ion-content>
