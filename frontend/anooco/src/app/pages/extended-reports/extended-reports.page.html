<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Extended Reports</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  
  <div class="ion-text-center ion-margin-bottom">
    <p>Help us improve the map by reporting issues.</p>
  </div>

  <ion-grid>
    <ion-row>
      <ion-col size="6" *ngFor="let type of reportTypes">
        <ion-card button (click)="submitReport(type.name)" class="report-card">
          <ion-card-content class="ion-text-center">
            <ion-icon [name]="type.icon" [color]="type.color" size="large"></ion-icon>
            <h3>{{ type.name }}</h3>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-list>
    <ion-list-header>
      <ion-label>Recent Reports</ion-label>
    </ion-list-header>
    
    <ion-item *ngIf="recentReports.length === 0">
      <ion-label class="ion-text-center">
        <p>No reports found.</p>
      </ion-label>
    </ion-item>

    <ion-card *ngFor="let report of recentReports" class="ion-margin-bottom">
      <ion-card-header>
        <ion-card-subtitle>{{ report.createdAt | date:'medium' }}</ion-card-subtitle>
        <ion-card-title>{{ report.reportType }}</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <p *ngIf="report.rawText">{{ report.rawText }}</p>
        <div *ngIf="report.hasImage" class="ion-margin-top">
          <img [src]="getImageUrl(report)" style="width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px;" />
        </div>
      </ion-card-content>
    </ion-card>
  </ion-list>

</ion-content>
