<ion-content class="auth-content" [fullscreen]="true">
  <div class="floating-header">
    <!-- Optional back button if needed, but for login often it's root. 
         We'll include it hidden or visible depending on navigation stack usually, 
         but here we'll just put the title or leave it clean. 
         Let's put a simple back button just in case they want to go back to a landing page. -->
    <div class="back-btn" (click)="goBack()">
      <ion-icon name="chevron-back-outline"></ion-icon>
    </div>
  </div>

  <div class="auth-container">
    <div class="header-section">
      <h1>Welcome Back</h1>
      <p>Login to continue.</p>
    </div>

    <div class="form-section">
      <div class="input-group">
        <ion-input
          placeholder="Email"
          type="email"
          [(ngModel)]="credentials.email"
          class="auth-input">
        </ion-input>
      </div>

      <div class="input-group">
        <ion-input
          placeholder="Password"
          type="password"
          [(ngModel)]="credentials.password"
          class="auth-input">
        </ion-input>
      </div>

      <div class="action-section">
        <ion-button expand="block" class="auth-button-primary" (click)="onLogin()">
          Log In
          <ion-icon slot="end" name="arrow-forward"></ion-icon>
        </ion-button>

        <div class="divider">or</div>

        <ion-button fill="clear" expand="block" class="auth-button-clear" routerLink="/signup">
          Create an Account
        </ion-button>
        
        <ion-button fill="clear" expand="block" class="auth-button-clear" routerLink="/dashboard">
          Continue as Guest
        </ion-button>
      </div>
    </div>
  </div>
</ion-content>
