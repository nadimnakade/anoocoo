<ion-content [fullscreen]="true">
  <!-- Fullscreen Map Background -->
  <div id="nav-map" class="full-screen-map"></div>

  <!-- Floating Header -->
  <div class="floating-header">
    <div class="back-btn" (click)="goBack()">
      <ion-icon name="chevron-back-outline"></ion-icon>
    </div>
    <div class="header-title">Plan Trip</div>
  </div>

  <!-- Floating Search Card -->
  <div class="search-overlay">
    <div class="search-card">
      <div class="input-row">
        <ion-icon name="radio-button-on" class="start-dot"></ion-icon>
        <input type="text" placeholder="Start Location" [(ngModel)]="startLocation" (input)="onSearchInput($event, 'start')" class="nav-input">
        <div class="input-action" *ngIf="isStartLoading">
           <ion-spinner name="dots" color="primary"></ion-spinner>
        </div>
        <div class="input-action" *ngIf="!isStartLoading" (click)="useCurrentLocation()">
           <ion-icon name="locate"></ion-icon>
        </div>
      </div>
      
      <div class="connector-line"></div>

      <div class="input-row">
        <ion-icon name="location" class="end-pin"></ion-icon>
        <input type="text" placeholder="Destination" [(ngModel)]="endLocation" (input)="onSearchInput($event, 'end')" class="nav-input">
        <div class="input-action" *ngIf="isEndLoading">
           <ion-spinner name="dots" color="primary"></ion-spinner>
        </div>
      </div>

      <!-- Suggestions Dropdown -->
      <div class="suggestions-list" *ngIf="startSuggestions.length > 0 || endSuggestions.length > 0">
        <div class="suggestion-item" *ngFor="let item of (startSuggestions.length ? startSuggestions : endSuggestions)" 
             (click)="selectAddress(item, startSuggestions.length ? 'start' : 'end')">
          <ion-icon name="location-outline"></ion-icon>
          <div class="suggestion-text">
            <h3>{{ item.display_name.split(',')[0] }}</h3>
            <p>{{ item.display_name }}</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Alert Radius Chip -->
    <div class="radius-chip">
      <ion-icon name="wifi"></ion-icon>
      <span>Radius: {{ alertRadius }} km</span>
      <ion-range [min]="0.5" [max]="10" [step]="0.5" [(ngModel)]="alertRadius" (ionChange)="updateRadius()" class="mini-range"></ion-range>
    </div>

    <!-- Action Button -->
    <button class="find-route-btn" (click)="findRoute()" [disabled]="!endLocation || isLoading">
      <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
      <span *ngIf="!isLoading">Start Navigation</span>
    </button>
  </div>

  <!-- Floating Bottom Stats (Visible when route active) -->
  <div class="bottom-stats-panel" *ngIf="routeStats" class="animate__animated animate__slideInUp">
    <div class="stats-grid">
      <div class="stat-box">
        <span class="value">{{ currentSpeed }}</span>
        <span class="label">km/h</span>
      </div>
      <div class="stat-box">
        <span class="value">{{ speedLimit }}</span>
        <span class="label">Limit</span>
      </div>
      <div class="stat-box danger">
        <span class="value">{{ routeEvents.length }}</span>
        <span class="label">Alerts</span>
      </div>
      <div class="stat-box">
        <span class="value">{{ routeStats.potholeCount || 0 }}</span>
        <span class="label">Potholes</span>
      </div>
    </div>
  </div>

  <!-- Floating FABs -->
  <div class="fab-container">
    <div class="fab-btn secondary" (click)="recenterMap()">
      <ion-icon name="navigate"></ion-icon>
    </div>
    <div class="fab-btn primary" id="report-fab-trigger">
      <ion-icon name="alert-circle"></ion-icon>
    </div>
  </div>

  <!-- Report Menu (Custom Implementation instead of ion-fab-list for better styling) -->
  <!-- Simplified for now, relying on main dashboard for reporting or could re-add expanded FAB if needed. 
       Keeping standard FAB logic visually separate if complex. -->
  
  <!-- Events List Slide-up (Optional) -->
  <div class="events-drawer" *ngIf="routeEvents.length > 0 && !routeStats">
    <!-- Collapsed view showing nearest event -->
  </div>

</ion-content>
