<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Plan a Drive</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-list>
    <ion-list-header>
      <ion-label>Calendar</ion-label>
    </ion-list-header>
    <ion-item button detail>
      <ion-icon slot="start" name="calendar-outline"></ion-icon>
      <ion-label>
        <h2>Connect Calendar</h2>
        <p>Get time-to-leave reminders</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <div class="empty-state" style="text-align: center; margin-top: 50px; color: #666;">
    <ion-icon name="time-outline" style="font-size: 48px;"></ion-icon>
    <h3>No planned drives</h3>
    <p>Tap + to plan a future trip</p>
  </div>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button>
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
