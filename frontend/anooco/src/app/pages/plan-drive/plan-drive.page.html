<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button color="primary"></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  
  <div class="header-section">
    <h1>Plan a Drive</h1>
  </div>

  <div class="search-wrapper">
    <ion-searchbar [(ngModel)]="searchQuery" (ionInput)="onSearch($event)" placeholder="Where to?" mode="ios"></ion-searchbar>
  </div>
  
  <ion-list *ngIf="searchResults.length > 0">
    <ion-item button lines="none" *ngFor="let result of searchResults" (click)="selectDestination(result)">
      <ion-icon slot="start" name="location-outline"></ion-icon>
      <ion-label>
        <h2>{{ result.display_name.split(',')[0] }}</h2>
        <p>{{ result.display_name }}</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <ion-list *ngIf="searchResults.length === 0">
    <ion-list-header>
      <ion-label>Suggestions</ion-label>
    </ion-list-header>
    
    <ion-item button lines="none" detail="false">
      <ion-icon slot="start" name="calendar-outline"></ion-icon>
      <ion-label>
        <h2>Connect Calendar</h2>
        <p>Get time-to-leave reminders</p>
      </ion-label>
    </ion-item>

    <ion-item button lines="none" detail="false">
      <ion-icon slot="start" name="home-outline"></ion-icon>
      <ion-label>
        <h2>Home</h2>
        <p>Add Home Address</p>
      </ion-label>
    </ion-item>

    <ion-item button lines="none" detail="false">
      <ion-icon slot="start" name="briefcase-outline"></ion-icon>
      <ion-label>
        <h2>Work</h2>
        <p>Add Work Address</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <div *ngIf="searchResults.length === 0 && !searchQuery" class="empty-state">
    <div class="icon-box">
      <ion-icon name="map-outline"></ion-icon>
    </div>
    <h3>Ready to go?</h3>
    <p>Search for a destination above to start navigation.</p>
  </div>
</ion-content>
