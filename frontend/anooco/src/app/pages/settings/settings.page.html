<div class="floating-header">
  <div class="back-btn" (click)="goBack()">
    <ion-icon name="chevron-back-outline"></ion-icon>
  </div>
  <div class="header-title">Settings</div>
</div>

<ion-content class="content-with-floating-header ion-padding">
  <ion-list lines="none">
    <ion-list-header>
      <ion-label>Preferences</ion-label>
    </ion-list-header>

    <ion-item class="setting-item">
      <ion-icon slot="start" name="notifications-outline"></ion-icon>
      <ion-label>Push Notifications</ion-label>
      <ion-toggle slot="end" checked></ion-toggle>
    </ion-item>

    <ion-item class="setting-item">
      <ion-icon slot="start" name="volume-high-outline"></ion-icon>
      <ion-label>Voice Guidance</ion-label>
      <ion-toggle slot="end" [checked]="roadFeatureService.enableVoice" (ionChange)="toggleVoice($event)"></ion-toggle>
    </ion-item>

    <ion-item class="setting-item">
      <ion-icon slot="start" name="location-outline"></ion-icon>
      <ion-label>Geolocation</ion-label>
      <ion-toggle slot="end" [checked]="roadFeatureService.enableGeolocation" (ionChange)="toggleGeolocation($event)"></ion-toggle>
    </ion-item>

    <ion-list-header>
      <ion-label>Account</ion-label>
    </ion-list-header>

    <ion-item button class="setting-item">
      <ion-icon slot="start" name="lock-closed-outline"></ion-icon>
      <ion-label>Privacy</ion-label>
    </ion-item>

    <ion-item button class="setting-item">
      <ion-icon slot="start" name="help-circle-outline"></ion-icon>
      <ion-label>Help & Support</ion-label>
    </ion-item>

    <ion-item button lines="none" class="setting-item logout-item">
      <ion-icon slot="start" name="log-out-outline" color="danger"></ion-icon>
      <ion-label color="danger">Log Out</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
