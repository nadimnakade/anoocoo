<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Community & Social</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="addFriend()">
        <ion-icon slot="icon-only" name="person-add-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  
  <ion-item lines="full">
    <ion-icon slot="start" name="eye-outline"></ion-icon>
    <ion-label>
      <h2>Visible on Map</h2>
      <p>Allow friends to see you</p>
    </ion-label>
    <ion-toggle slot="end" [(ngModel)]="isVisible"></ion-toggle>
  </ion-item>

  <ion-list-header>
    <ion-label>Friends ({{ friends.length }})</ion-label>
  </ion-list-header>

  <ion-list>
    <ion-item *ngFor="let friend of friends">
      <ion-avatar slot="start">
        <img [src]="friend.avatar" />
      </ion-avatar>
      <ion-label>
        <h2>{{ friend.name }}</h2>
        <p>{{ friend.status }}</p>
      </ion-label>
      <ion-button slot="end" fill="outline" size="small" (click)="sendBeep(friend.name)">
        Beep 👋
      </ion-button>
    </ion-item>
  </ion-list>

  <ion-list-header>
    <ion-label>Groups & Chats</ion-label>
  </ion-list-header>
  
  <ion-item button detail>
    <ion-icon slot="start" name="people-outline" color="tertiary"></ion-icon>
    <ion-label>Map Chat</ion-label>
  </ion-item>
  
  <ion-item button detail>
    <ion-icon slot="start" name="car-sport-outline" color="secondary"></ion-icon>
    <ion-label>Carpool Groups</ion-label>
  </ion-item>

</ion-content>
