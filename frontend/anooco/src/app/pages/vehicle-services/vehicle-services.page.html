<ion-content [fullscreen]="true">
  <div class="floating-header">
    <div class="header-left">
      <div class="back-btn" (click)="goBack()">
        <ion-icon name="chevron-back-outline"></ion-icon>
      </div>
      <div class="header-title">Vehicle Services</div>
    </div>
    <div class="header-right">
      <div class="action-btn">
        <ion-icon name="ellipsis-horizontal"></ion-icon>
      </div>
    </div>
  </div>

  <div class="content-container">
    <div class="floating-segment">
      <ion-segment [value]="segmentValue" (ionChange)="segmentChanged($event)" mode="ios">
        <ion-segment-button value="gas">
          <ion-label>Gas</ion-label>
        </ion-segment-button>
        <ion-segment-button value="parking">
          <ion-label>Parking</ion-label>
        </ion-segment-button>
        <ion-segment-button value="ev">
          <ion-label>EV</ion-label>
        </ion-segment-button>
      </ion-segment>
    </div>
  
    <div *ngIf="isLoading" class="ion-text-center ion-padding" style="margin-top: 20px;">
      <ion-spinner color="primary"></ion-spinner>
      <p style="color: var(--ion-color-medium); margin-top: 10px;">Finding nearby {{ segmentValue }}...</p>
    </div>

    <div *ngIf="!isLoading">
      <div class="info-card">
        <ion-item lines="none" class="info-item">
          <div class="icon-box" [ngClass]="segmentValue" slot="start">
             <ion-icon [name]="segmentValue === 'gas' ? 'color-fill' : (segmentValue === 'parking' ? 'car' : 'battery-charging')"></ion-icon>
          </div>
          <ion-label class="ion-text-wrap">
            <h2>Find Nearby Services</h2>
            <p>Locating services around you (5km radius).</p>
          </ion-label>
        </ion-item>
      </div>
      
      <div class="results-header" *ngIf="services.length > 0">
        Nearby Results ({{ services.length }})
      </div>

      <div class="results-list">
        <div class="service-card" *ngFor="let service of services" (click)="navigateToService(service)">
          <div class="service-content">
            <div class="icon-box" [ngClass]="segmentValue">
              <ion-icon [name]="segmentValue === 'gas' ? 'location' : (segmentValue === 'parking' ? 'navigate' : 'flash')"></ion-icon>
            </div>
            
            <div class="service-info">
              <h2>{{ service.name }}</h2>
              <p *ngIf="service.details">{{ service.details }}</p>
            </div>
            
            <div class="go-btn">
              Go
            </div>
          </div>
        </div>
      </div>

      <div *ngIf="services.length === 0" class="empty-state">
        <p>No services found in this area.</p>
      </div>
    </div>
  </div>
</ion-content>
